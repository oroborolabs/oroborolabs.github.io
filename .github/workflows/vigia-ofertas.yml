name: vigia-ofertas

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia-ofertas
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o robô
        working-directory: vigia-ofertas
        run: python robo.py

      - name: Gravar o histórico, se mudou
        run: |
          if [ -n "$(git status --porcelain vigia-ofertas/historico.csv vigia-ofertas/estado.json vigia-ofertas/ultimo_check.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vigia-ofertas/historico.csv vigia-ofertas/estado.json vigia-ofertas/ultimo_check.json
            git commit -m "vigia-ofertas: atualização automática"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
